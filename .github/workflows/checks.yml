name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  timer-and-localization:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Timer-state checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/restleaf-tests"
          printf 'runEngineTests()\n' > "$RUNNER_TEMP/restleaf-tests/main.swift"
          swiftc Sources/Engine.swift "$RUNNER_TEMP/restleaf-tests/main.swift" -o "$RUNNER_TEMP/restleaf-tests/checks"
          "$RUNNER_TEMP/restleaf-tests/checks"
      - name: Localization completeness and format checks
        run: python3 scripts/check_localizations.py
